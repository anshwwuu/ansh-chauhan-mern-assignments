<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Campus Club Application</title><link rel="stylesheet" href="style.css"></head><body><main class="form-card"><p class="eyebrow">INVERTIS UNIVERSITY · STUDENT LIFE</p><h1>Campus Club Application</h1><p>Complete this practice form to express your interest in joining a campus club.</p><form action="#" method="get"><fieldset><legend>Personal details</legend>
<div class="field"><label for="fullname">Full name</label><input id="fullname" name="fullname" type="text" placeholder="Ansh Chauhan" minlength="2" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digit mobile number" required></div>
<div class="field"><label for="portfolio">Portfolio URL (optional)</label><input id="portfolio" name="portfolio" type="url" placeholder="https://example.com"></div>
<div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="16" max="30" value="18" required></div></fieldset>
<fieldset><legend>Club preferences</legend><div class="field"><span class="field-label">Preferred club</span><label class="choice"><input type="radio" name="club" value="coding" required> Coding</label><label class="choice"><input type="radio" name="club" value="football"> Football</label><label class="choice"><input type="radio" name="club" value="music"> Music</label></div>
<div class="field"><span class="field-label">Areas of interest</span><label class="choice"><input type="checkbox" name="interest" value="events"> Events</label><label class="choice"><input type="checkbox" name="interest" value="learning"> Learning</label><label class="choice"><input type="checkbox" name="interest" value="competition"> Competitions</label></div>
<div class="field"><label for="year">Study year</label><select id="year" name="year" required><option value="">Choose one</option><option>First year</option><option>Second year</option><option>Third year</option><option>Fourth year</option></select></div>
<div class="field"><label for="campus">Campus (type or choose)</label><input id="campus" name="campus" list="campuses" placeholder="Start typing"><datalist id="campuses"><option value="Bareilly"><option value="Other"></datalist></div>
<div class="field"><label for="start">Available start date</label><input id="start" name="start" type="date"></div><div class="field"><label for="meeting">Preferred meeting time</label><input id="meeting" name="meeting" type="time"></div>
<div class="field"><label for="document">Upload a sample file</label><input id="document" name="document" type="file" accept=".pdf,.jpg,.png"></div><div class="field"><label for="commitment">Weekly time commitment: <output id="hours">4</output> hours</label><input id="commitment" name="commitment" type="range" min="1" max="10" value="4" oninput="hours.value=this.value"></div><div class="field"><label for="colour">Choose a theme colour</label><input id="colour" name="colour" type="color" value="#176b63"></div>
<div class="field"><label for="about">Why would you like to join?</label><textarea id="about" name="about" rows="4" minlength="10" placeholder="Tell us briefly..." required></textarea></div></fieldset><div class="actions"><button type="submit">Submit application</button><button class="reset" type="reset">Reset form</button></div></form></main></body></html>
